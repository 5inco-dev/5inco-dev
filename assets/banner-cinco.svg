<svg width="100%" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinco — Desenvolvedor em formação">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1A2847"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>
  
  <!-- Accent bar (top left) -->
  <rect x="75" y="80" width="60" height="8" fill="#2DD4BF" rx="4"/>
  
  <!-- Main text: Cinco -->
  <text x="75" y="180" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="bold" fill="#F8FAFC" letter-spacing="2">
    Cinco
  </text>
  
  <!-- Subtitle -->
  <text x="75" y="230" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#94A3B8" letter-spacing="0.5">
    Desenvolvimento de software · Banco de dados
  </text>
  
  <!-- Geometric network: 5 connected nodes (right side) -->
  <!-- Lines connecting nodes -->
  <g stroke="#2DD4BF" stroke-width="2" opacity="0.8" fill="none">
    <!-- Node 1 to Node 2 -->
    <line x1="950" y1="100" x2="1050" y2="85"/>
    <!-- Node 2 to Node 3 -->
    <line x1="1050" y1="85" x2="1100" y2="160"/>
    <!-- Node 3 to Node 4 -->
    <line x1="1100" y1="160" x2="1050" y2="240"/>
    <!-- Node 4 to Node 5 -->
    <line x1="1050" y1="240" x2="920" y2="200"/>
    <!-- Node 5 to Node 1 -->
    <line x1="920" y1="200" x2="950" y2="100"/>
    <!-- Cross connections -->
    <line x1="950" y1="100" x2="1100" y2="160"/>
    <line x1="920" y1="200" x2="1050" y2="85"/>
  </g>
  
  <!-- Nodes (circles) -->
  <g fill="#2DD4BF">
    <circle cx="950" cy="100" r="8"/>
    <circle cx="1050" cy="85" r="8"/>
    <circle cx="1100" cy="160" r="8"/>
    <circle cx="1050" cy="240" r="8"/>
    <circle cx="920" cy="200" r="8"/>
  </g>
</svg>
