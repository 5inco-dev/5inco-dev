<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Banner de perfil profissional para GitHub — Cinco</title>
<desc>Banner escuro e minimalista com o nome Cinco, área de atuação em desenvolvimento, banco de dados e Scrum Master, e um marco geométrico de cinco nós conectados no lado direito.</desc>
<defs>
<linearGradient id="bgFade" x1="0" y1="0" x2="680" y2="220" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#0B1220"/>
<stop offset="100%" stop-color="#0F1A2E"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="680" height="220" fill="url(#bgFade)"/>
<g stroke="#1E293B" stroke-width="0.5" opacity="0.6">
<line x1="0" y1="40" x2="680" y2="40"/>
<line x1="0" y1="180" x2="680" y2="180"/>
</g>
<rect x="48" y="62" width="42" height="3" fill="#2DD4BF"/>
<text x="48" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="500" fill="#F5F5F0">Cinco</text>
<text x="48" y="132" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Desenvolvimento de software</text>
<text x="48" y="154" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Banco de dados  ·  Scrum master</text>
<text x="48" y="196" font-family="Arial, sans-serif" font-size="12" fill="#5B6B84">ADS — Universidade Cruzeiro do Sul</text>
<g stroke="#2DD4BF" stroke-width="0.7" opacity="0.85" fill="none">
<line x1="562" y1="72" x2="600" y2="60"/>
<line x1="600" y1="60" x2="620" y2="100"/>
<line x1="620" y1="100" x2="590" y2="140"/>
<line x1="590" y1="140" x2="552" y2="120"/>
<line x1="552" y1="120" x2="562" y2="72"/>
<line x1="562" y1="72" x2="590" y2="140"/>
</g>
<circle cx="562" cy="72" r="4.5" fill="#2DD4BF"/>
<circle cx="600" cy="60" r="4.5" fill="#5EEAD4"/>
<circle cx="620" cy="100" r="4.5" fill="#2DD4BF"/>
<circle cx="590" cy="140" r="4.5" fill="#5EEAD4"/>
<circle cx="552" cy="120" r="4.5" fill="#2DD4BF"/>
</svg>
